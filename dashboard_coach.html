<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Coach - SportClub</title>
    <link rel="stylesheet" href="./css/style_dashboard_coach.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="./assets/logo_empresa_letra_v1.png" alt="SportClub">
        </div>

        <nav>
            <a href="dashboard_coach.html">Inicio</a>
            <a href="#">Alumnos</a>
            <a href="#">Clases</a>
            <a href="#">Horarios</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="login.html" id="logoutButton">Cerrar Sesión</a>
        </nav>
    </header>

    <main>

        <section class="resumen">
            <div class="card">
                <h2 id="coachName">Coach</h2>
                <p>Usuario autenticado</p>
            </div>

            <div class="card">
                <h2 id="studentCount">0</h2>
                <p>Total Usuarios</p>
            </div>

            <div class="card">
                <h2 id="coachCount">0</h2>
                <p>Total Coaches</p>
            </div>
        </section>

        <section>
            <h1>Panel Coach</h1>
            <p>Visualiza los usuarios registrados en SportClub.</p>

            <p id="coachMessage"></p>

            <table>
                <thead>
                    <tr>
                        <th>Nombre completo</th>
                        <th>Correo</th>
                        <th>Rol</th>
                    </tr>
                </thead>

                <tbody id="studentsTableBody">
                </tbody>
            </table>
        </section>

    </main>

    <script src="./js/config.js"></script>
    <script src="./js/dashboard_coach.js"></script>

</body>

</html>
