<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - SportClub</title>
    <link rel="stylesheet" href="./css/style_dashboard_admin.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="./assets/logo_empresa_letra_v1.png" alt="SportClub">
        </div>

        <nav>
            <a href="#" class="active">Usuarios</a>
            <a href="#">Reportes</a>
            <a href="#">Configuración</a>
            <a href="#">Clases</a>
            <a href="login.html" id="logoutButton">Cerrar Sesión</a>
        </nav>
    </header>

    <main>

        <section class="estadisticas">
            <div class="card">
                <h2 id="totalUsers">0</h2>
                <p>Total Usuarios</p>
            </div>

            <div class="card">
                <h2 id="totalCoaches">0</h2>
                <p>Total Coaches</p>
            </div>

            <div class="card">
                <h2 id="totalAdmins">0</h2>
                <p>Total Administradores</p>
            </div>
        </section>

        <section>
            <h1>Gestión de Usuarios</h1>
            <p>Administra los usuarios del sistema.</p>

            <button type="button" id="newUserButton">
                + Nuevo Usuario
            </button>

            <p id="adminMessage"></p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre completo</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Fecha Registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="usersTableBody">
                </tbody>
            </table>
        </section>

        <section id="userFormSection" hidden>
            <h2 id="formTitle">Nuevo Usuario</h2>

            <form id="userForm">

                <input type="hidden" id="userId">

                <label for="fullName">Nombre completo:</label>
                <input type="text" id="fullName">
                <small id="fullNameError"></small>

                <label for="email">Email:</label>
                <input type="email" id="email">
                <small id="emailError"></small>

                <label for="role">Rol:</label>
                <select id="role">
                    <option value="user">Usuario</option>
                    <option value="coach">Coach</option>
                    <option value="admin">Administrador</option>
                </select>

                <label for="password">Contraseña:</label>
                <input type="password" id="password">
                <small id="passwordError"></small>

                <label for="confirmPassword">Confirmar contraseña:</label>
                <input type="password" id="confirmPassword">
                <small id="confirmPasswordError"></small>

                <br><br>

                <button type="submit">Guardar Usuario</button>
                <button type="button" id="cancelButton">Cancelar</button>

            </form>
        </section>

    </main>

    <script src="./js/config.js"></script>
    <script src="./js/dashboard_admin.js"></script>

</body>

</html>
