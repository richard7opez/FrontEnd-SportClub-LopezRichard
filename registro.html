<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro SportClub</title>
    <link rel="stylesheet" href="./css/style_registro.css">
</head>

<body>

    <div class="card">

        <div class="logo">
            <img src="./assets/logo_empresa_letra_v1.png" alt="SportClub">
        </div>

        <h2>Registro</h2>

        <form id="registerForm">

            <label for="fullName">Nombre completo:</label>
            <input type="text" id="fullName" placeholder="Ingresa tu nombre completo">
            <small id="fullNameError"></small>

            <label for="birthDate">Fecha de nacimiento:</label>
            <input type="date" id="birthDate">
            <small id="birthDateError"></small>

            <label for="email">Correo:</label>
            <input type="email" id="email" placeholder="Ingresa tu correo">
            <small id="emailError"></small>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Mínimo 8 caracteres">
            <small id="passwordError"></small>

            <label for="confirmPassword">Confirmar contraseña:</label>
            <input type="password" id="confirmPassword" placeholder="Confirma tu contraseña">
            <small id="confirmPasswordError"></small>

            <label for="sport">Deporte:</label>
            <select id="sport">
                <option value="">Seleccione una actividad</option>
                <option value="football">Fútbol</option>
                <option value="gym">Gimnasio</option>
                <option value="running">Running</option>
                <option value="swimming">Natación</option>
                <option value="other">Otro</option>
            </select>

            <p id="registerMessage"></p>

            <button type="submit">Registrarse</button>

        </form>

        <br>

        <a href="login.html">¿Ya tienes cuenta? Iniciar sesión</a>

    </div>

    <script src="./js/config.js"></script>
    <script src="./js/registro.js"></script>

</body>

</html>
