<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro SportClub</title>
<link rel="stylesheet" href=".\css\style_registro.css">
</head>

<body>

<div class="card">

<div class="logo">

<img src=".\assets\logo_empresa_letra_v1.png" alt="SportClub">

</div>

<h2></h2>Registro</h2>

<form>

<label>Nombre:</label>
<input type="text" placeholder="Ingresa tu nombre">

<label>Edad:</label>
<input type="number" placeholder="Ingresa tu edad">

<label>Correo:</label>
<input type="email" placeholder="Ingresa tu correo">

<label>Contraseña:</label>
<input type="password" placeholder="Ingresa una contraseña">

<label>¿Practica algún deporte?</label>

<select>

<option>Seleccione una opción</option>
<option>Sí</option>
<option>No</option>

</select>

<label>Tipo de actividad:</label>

<select>

<option>Seleccione actividad</option>
<option>Fútbol</option>
<option>Gimnasio</option>
<option>Running</option>
<option>Natación</option>
<option>Otro</option>

</select>

<label>Objetivo:</label>

<select>

<option>Seleccione objetivo</option>
<option>Bajar de peso</option>
<option>Mantenerse activo</option>
<option>Ganar masa muscular</option>
<option>Mejorar condición física</option>

</select>

<button type="submit">

Registrarse

</button>

</form>

</div>

</body>
</html>
